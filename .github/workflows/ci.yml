name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 타입 체크
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      # 빌드까지 통과해야 "컴파일 성공"이 의미가 있다 (규약 §2-2).
      - name: 프로덕션 빌드
        run: npm run build
